name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag matching the tracked project version
        required: true
        default: v0.1.0

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  draft-release:
    runs-on: windows-latest
    timeout-minutes: 60

    env:
      RELEASE_TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Require main branch
        shell: pwsh
        run: |
          if ("${{ github.ref }}" -ne "refs/heads/main") {
            throw "Release workflow must be dispatched from main."
          }

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Cache Sarasa Gothic
        uses: actions/cache@v6
        with:
          path: Font
          key: sarasa-gothic-1.0.40-${{ runner.os }}

      - name: Prepare fonts
        run: npm run setup:fonts

      - name: Verify release version
        run: npm run verify:version -- "$env:RELEASE_TAG"

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build web workspaces
        run: npm run build

      - name: Check Tauri desktop
        run: npm run check:desktop

      - name: Build NSIS installer
        run: npm run build -w @airnobe/desktop

      - name: Prepare release assets
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG.Substring(1)
          $expectedName = "Airnobe_${version}_x64-setup.exe"
          $source = Get-ChildItem "apps/desktop/src-tauri/target/release/bundle/nsis" -Filter "Airnobe_*_x64-setup.exe"
          if ($source.Count -ne 1) {
            throw "Expected exactly one x64 NSIS installer, found $($source.Count)."
          }
          New-Item -ItemType Directory -Path "release-artifacts" -Force | Out-Null
          $installer = Join-Path "release-artifacts" $expectedName
          Copy-Item -LiteralPath $source[0].FullName -Destination $installer
          $hash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $expectedName" | Set-Content -LiteralPath "release-artifacts/SHA256SUMS.txt" -Encoding ascii

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: airnobe-${{ inputs.tag }}-windows-x64
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 14

      - name: Create draft prerelease
        shell: pwsh
        run: |
          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "Release $env:RELEASE_TAG already exists."
          }
          $version = $env:RELEASE_TAG.Substring(1)
          $notes = "release-notes/$version.md"
          if (-not (Test-Path -LiteralPath $notes)) {
            throw "Missing release notes: $notes"
          }
          gh release create $env:RELEASE_TAG `
            "release-artifacts/Airnobe_${version}_x64-setup.exe" `
            "release-artifacts/SHA256SUMS.txt" `
            --target $env:GITHUB_SHA `
            --title "Airnobe $env:RELEASE_TAG" `
            --notes-file $notes `
            --draft `
            --prerelease `
            --latest=false
