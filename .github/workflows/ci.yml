name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Cache Sarasa Gothic
        uses: actions/cache@v6
        with:
          path: Font
          key: sarasa-gothic-1.0.40-${{ runner.os }}

      - name: Prepare fonts
        run: npm run setup:fonts

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build web workspaces
        run: npm run build

      - name: Check Tauri desktop
        run: npm run check:desktop
